      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does the academy guarantee a job at Neeglo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The academy is a training programme, not a job offer. Top performers may be invited to join Neeglo, but retention depends on performance, readiness and the roles open at the time."
            }
          },
          {
            "@type": "Question",
            "name": "When can I apply to the academy?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The first cohort launches in February 2027. Applications will open ahead of the cohort, and scholarship and pricing details will be published before then."
            }
          },
          {
            "@type": "Question",
            "name": "Can I apply if there is no open role?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Use the general application route by emailing careers@neeglo.com. We keep CVs on file for future roles, and you can ask us to remove yours at any time."
            }
          }
        ]
      }
